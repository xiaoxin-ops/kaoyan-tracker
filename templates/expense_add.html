<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记一笔 · 研途追踪</title>
<meta name="theme-color" content="#A3B18A">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app-shell">

  {% include '_sidebar.html' %}

  <div class="main">
    {% include '_nav_mobile.html' %}

    <main class="content">
      <div class="page-head">
        <div>
          <h4 class="page-title">记一笔</h4>
          <div class="page-sub">新增一笔支出记录</div>
        </div>
        <a href="/expenses" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left me-1"></i>返回账单
        </a>
      </div>

      <div class="row justify-content-center">
        <div class="col-lg-7">
          <div class="card">
            <div class="card-head">💰 支出信息</div>
            <div class="card-body">
              {% if error %}
              <div class="alert alert-danger alert-soft py-2">{{ error }}</div>
              {% endif %}
              <form method="post" action="/expense/add" novalidate>
                <div class="mb-3">
                  <label class="form-label">金额（元）</label>
                  <input type="number" step="0.01" min="0.01" max="1000000" name="amount"
                         class="form-control" value="{{ form.amount or '' }}" placeholder="如 12.50" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">类别</label>
                  <select name="category" class="form-select" required>
                    {% for c in categories %}
                    <option value="{{ c }}" {% if form.category == c %}selected{% endif %}>{{ c }}</option>
                    {% endfor %}
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label">日期</label>
                  <input type="date" name="date" class="form-control" value="{{ form.date or today }}" required>
                </div>
                <div class="mb-1">
                  <label class="form-label">备注（可选）</label>
                  <input type="text" name="description" maxlength="200" class="form-control"
                         value="{{ form.description or '' }}" placeholder="用途说明，如：数学辅导书">
                </div>
                <div class="d-flex gap-2 mt-4">
                  <button type="submit" class="btn btn-primary btn-soft px-4">
                    <i class="bi bi-check2 me-1"></i>保存
                  </button>
                  <a href="/expenses" class="btn btn-outline-secondary px-4">取消</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
