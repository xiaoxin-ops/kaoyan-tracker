<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注册 · 研途追踪</title>
<meta name="theme-color" content="#A3B18A">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
<nav class="auth-topbar">
  <a href="/" class="auth-brand">
    <span class="brand-mark brand-mark-sm">研</span>
    <span class="brand-title">研途追踪</span>
  </a>
  <div class="d-flex gap-2">
    <a href="/login" class="btn btn-outline-secondary btn-sm">登录</a>
    <a href="/register" class="btn btn-primary btn-soft btn-sm">注册</a>
  </div>
</nav>
<div class="login-wrap">
  <div class="card login-card">
    <div class="card-body p-4 p-md-5 text-center">
      <span class="brand-mark login-mark">研</span>
      <h4 class="mt-3 mb-1">创建账户</h4>
      <div class="text-muted small mb-4">每个账户的学习数据相互独立</div>

      {% if error %}
      <div class="alert alert-danger alert-soft py-2 small">{{ error }}</div>
      {% endif %}

      <form method="post" action="/register" class="text-start">
        <div class="mb-3">
          <label class="form-label small text-muted mb-1">用户名</label>
          <input type="text" name="username" class="form-control" maxlength="20"
                 placeholder="2-20 个字符" autofocus required autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label small text-muted mb-1">密码</label>
          <input type="password" name="password" class="form-control" minlength="6"
                 placeholder="至少 6 位" required autocomplete="new-password">
        </div>
        <div class="mb-3">
          <label class="form-label small text-muted mb-1">确认密码</label>
          <input type="password" name="confirm_password" class="form-control" minlength="6"
                 placeholder="再输一遍密码" required autocomplete="new-password">
        </div>
        <div class="mb-3">
          <label class="form-label small text-muted mb-1">邮箱（可选）</label>
          <input type="email" name="email" class="form-control" maxlength="120"
                 placeholder="用于找回账户，可不填">
        </div>
        <button type="submit" class="btn btn-primary btn-soft w-100">
          <i class="bi bi-person-plus me-1"></i>注册并进入
        </button>
      </form>
      <div class="small text-muted mt-3">
        已有账户？<a href="/login" style="color:var(--sage-deep)">直接登录</a>
      </div>
    </div>
  </div>
  <div class="text-center text-muted small mt-3">Flask · SQLite · Bootstrap 5</div>
</div>
</body>
</html>
