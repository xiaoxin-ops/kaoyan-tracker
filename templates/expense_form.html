<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if mode == 'edit' %}编辑账单{% else %}记一笔{% endif %} · 研途追踪</title>
<meta name="theme-color" content="#A3B18A">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="manifest" href="/static/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="研途追踪">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
</head>
<body>
<div class="app-shell">

  {% include '_sidebar.html' %}

  <div class="main">
    {% include '_nav_mobile.html' %}

    <main class="content">
      <div class="page-head">
        <div>
          <h4 class="page-title">{% if mode == 'edit' %}编辑账单{% else %}记一笔{% endif %}</h4>
          <div class="page-sub">{% if mode == 'edit' %}修改这笔收支记录{% else %}新增一笔收入或支出{% endif %}</div>
        </div>
        <a href="/expenses" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left me-1"></i>返回账单
        </a>
      </div>

      <div class="row justify-content-center">
        <div class="col-lg-7">
          <div class="card">
            <div class="card-head">💰 收支信息</div>
            <div class="card-body">
              {% if error %}
              <div class="alert alert-danger alert-soft py-2">{{ error }}</div>
              {% endif %}
              <form method="post"
                    action="{% if mode == 'edit' %}/expense/edit/{{ expense.id }}{% else %}/expense/add{% endif %}"
                    novalidate>
                <div class="mb-3">
                  <label class="form-label">类型</label>
                  <div class="btn-group w-100" role="group" aria-label="收支类型">
                    <input type="radio" class="btn-check" name="type" id="type-expense"
                           value="expense" {% if form.type != 'income' %}checked{% endif %}>
                    <label class="btn btn-outline-secondary" for="type-expense">💸 支出</label>
                    <input type="radio" class="btn-check" name="type" id="type-income"
                           value="income" {% if form.type == 'income' %}checked{% endif %}>
                    <label class="btn btn-outline-secondary" for="type-income">💰 收入</label>
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label">类别</label>
                  <select name="category_id" class="form-select" id="category-select" required></select>
                </div>
                <div class="mb-3">
                  <label class="form-label">金额（元）</label>
                  <input type="number" step="0.01" min="0.01" max="1000000" name="amount"
                         class="form-control" value="{{ form.amount or '' }}" placeholder="如 12.50" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">日期</label>
                  <input type="date" name="date" class="form-control" value="{{ form.date or today }}" required>
                </div>
                <div class="mb-1">
                  <label class="form-label">备注（可选）</label>
                  <input type="text" name="description" maxlength="200" class="form-control"
                         value="{{ form.description or '' }}" placeholder="用途说明，如：生活费到账">
                </div>
                <div class="d-flex gap-2 mt-4">
                  <button type="submit" class="btn btn-primary btn-soft px-4">
                    <i class="bi bi-check2 me-1"></i>保存
                  </button>
                  <a href="/expenses" class="btn btn-outline-secondary px-4">取消</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
'use strict';
// 当前用户的全部类别（服务端注入），按所选类型动态刷新下拉
const CATS = {{ categories_json | safe }};
const sel = document.getElementById('category-select');

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function rebuildCategories() {
  const t = document.querySelector('input[name=type]:checked').value;
  sel.innerHTML = CATS
    .filter((c) => c.type === t)
    .map((c) => '<option value="' + c.id + '">' + esc(c.name) + '</option>')
    .join('');
}

document.querySelectorAll('input[name=type]').forEach((r) => {
  r.addEventListener('change', rebuildCategories);
});

rebuildCategories();
// 编辑模式回填已选类别（先按类型重建，再设置选中项）
{% if form.category_id %}sel.value = '{{ form.category_id }}';{% endif %}
</script>
{% include '_pwa.html' %}
</body>
</html>
