<!-- ==================== 顶部导航（移动端，全站共享） ==================== -->
<nav class="mobile-nav">
  <span class="brand-title">研途追踪</span>
  <div class="d-flex gap-1">
    <a class="nav-item" href="/#dashboard" data-view="dashboard"><i class="bi bi-speedometer2"></i></a>
    <a class="nav-item" href="/#records" data-view="records"><i class="bi bi-journal-text"></i></a>
    <a class="nav-item" href="/#diary" data-view="diary"><i class="bi bi-journal-bookmark"></i></a>
    <a class="nav-item" href="/#subjects" data-view="subjects"><i class="bi bi-collection"></i></a>
    <a class="nav-item{% if active_page == 'expenses' %} active{% endif %}" href="/expenses"><span class="nav-emoji">📒</span></a>
    {% if current_user.is_authenticated %}
    <div class="dropdown">
      <button type="button" class="nav-item dropdown-toggle" data-bs-toggle="dropdown" title="{{ current_user.username }}" aria-expanded="false">
        <i class="bi bi-person-circle"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end dropdown-menu-morandi">
        <li><span class="dropdown-item-text small text-muted">欢迎，{{ current_user.username }}</span></li>
        <li><a class="dropdown-item" href="/profile"><i class="bi bi-person-gear me-2"></i>个人中心</a></li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <form method="post" action="/logout" class="m-0">
            <button type="submit" class="dropdown-item dropdown-logout">
              <i class="bi bi-box-arrow-left me-2"></i>退出登录
            </button>
          </form>
        </li>
      </ul>
    </div>
    {% endif %}
  </div>
</nav>
