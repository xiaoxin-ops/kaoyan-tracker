<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 研途追踪</title>
<meta name="theme-color" content="#A3B18A">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
<div class="login-wrap">
  <div class="card login-card">
    <div class="card-body p-4 p-md-5 text-center">
      <span class="brand-mark login-mark">研</span>
      <h4 class="mt-3 mb-1">研途追踪</h4>
      <div class="text-muted small mb-4">请输入访问密码</div>

      {% if error %}
      <div class="alert alert-danger alert-soft py-2 small">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control text-center"
                 placeholder="访问密码" autofocus required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-soft w-100 mt-3">
          <i class="bi bi-box-arrow-in-right me-1"></i>进入
        </button>
      </form>
    </div>
  </div>
  <div class="text-center text-muted small mt-3">Flask · SQLite · Bootstrap 5</div>
</div>
</body>
</html>
