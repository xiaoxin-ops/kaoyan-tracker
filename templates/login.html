<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 研途追踪</title>
<meta name="theme-color" content="#A3B18A">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="manifest" href="/static/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="研途追踪">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
</head>
<body class="login-body">
<nav class="auth-topbar">
  <a href="/" class="auth-brand">
    <span class="brand-mark brand-mark-sm">研</span>
    <span class="brand-title">研途追踪</span>
  </a>
  <div class="d-flex gap-2">
    <a href="/login" class="btn btn-outline-secondary btn-sm">登录</a>
    <a href="/register" class="btn btn-primary btn-soft btn-sm">注册</a>
  </div>
</nav>
<div class="login-wrap">
  <div class="card login-card">
    <div class="card-body p-4 p-md-5 text-center">
      <span class="brand-mark login-mark">研</span>
      <h4 class="mt-3 mb-1">研途追踪</h4>
      <div class="text-muted small mb-4">登录你的账户</div>

      {% if error %}
      <div class="alert alert-danger alert-soft py-2 small">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login" class="text-start">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
          <label class="form-label small text-muted mb-1">用户名</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" name="username" class="form-control"
                   placeholder="你的用户名" autofocus required autocomplete="username">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label small text-muted mb-1">密码</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" class="form-control"
                   placeholder="你的密码" required autocomplete="current-password">
          </div>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" name="remember" id="remember" value="on">
          <label class="form-check-label small text-muted" for="remember">30 天内免登录</label>
        </div>
        <button type="submit" class="btn btn-primary btn-soft w-100">
          <i class="bi bi-box-arrow-in-right me-1"></i>进入
        </button>
      </form>
      <div class="small text-muted mt-3">
        还没有账户？<a href="/register" style="color:var(--sage-deep)">立即注册</a>
      </div>
    </div>
  </div>
  <div class="text-center text-muted small mt-3">Flask · SQLite · Bootstrap 5</div>
</div>
{% include '_pwa.html' %}
</body>
</html>
