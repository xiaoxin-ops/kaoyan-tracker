<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>离线中 · 研途追踪</title>
<meta name="theme-color" content="#A3B18A">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#F4F2EC;color:#4B4A44;
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif}
.card{background:#FCFBF7;border:1px solid #E6E1D5;border-radius:16px;padding:40px 32px;
  text-align:center;box-shadow:0 3px 14px rgba(75,74,68,.05)}
.emoji{font-size:3rem}
h1{font-size:1.2rem;margin:16px 0 8px}
p{color:#8C8A80;font-size:.9rem;margin:0 0 20px}
button{background:#A3B18A;border:0;color:#fff;padding:10px 28px;border-radius:10px;font-size:.95rem;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <div class="emoji">📡</div>
  <h1>网络不给力</h1>
  <p>当前处于离线状态，联网后刷新即可继续使用研途追踪</p>
  <button onclick="location.reload()">重新加载</button>
</div>
</body>
</html>
